name: k8s-node-stig-baseline
title: Kubernetes STIG V2R6 Node OS Checks
maintainer: MITRE SAF Team
copyright: MITRE, 2022
copyright_email: saf@groups.mitre.org
license: Apache-2.0
summary: InSpec testing for baseline compliance with the Kubernetes STIG Node OS Checks.
description: An InSpec profile verifying Kubernetes STIG V2R6 node OS requirements.
version: 1.0.0
inspec_version: ">= 4.0"

supports:
  - platform-family: linux

depends:
  - name: inspec-k8s-node
    git: https://github.com/mitre/inspec-k8s-node.git
    commit: 7d06efc66f9b9ff12f3544e0d2f3bb1cba6c4dd0

inputs:
  # SV-242376, SV-242377, SV-242378, SV-242379, SV-242380, SV-242381,
  # SV-242382, SV-242384, SV-242385, SV-242389, SV-242390, SV-242392,
  # SV-242393, SV-242394, SV-242397, SV-242398, SV-242399, SV-242400,
  # SV-242402, SV-242403, SV-242409, SV-242418, SV-242419, SV-242420,
  # SV-242421, SV-242422, SV-242423, SV-242424, SV-242425, SV-242426,
  # SV-242427, SV-242428, SV-242429, SV-242430, SV-242431, SV-242432,
  # SV-242433, SV-242434, SV-242436, SV-242438, SV-242443, SV-242445,
  # SV-242449, SV-242450, SV-242459, SV-242461, SV-242462, SV-242463,
  # SV-242464, SV-242465, SV-245541, SV-245542, SV-245543, SV-245544,
  # SV-254800, SV-254801, SV-274882
  - name: node_roles
    description: "Roles assigned to the target Kubernetes node. Supported values are 'control-plane' and 'worker'; include both for a dual-role node."
    type: Array
    required: true

  # SV-242376, SV-242377, SV-242378, SV-242379, SV-242380, SV-242381,
  # SV-242382, SV-242384, SV-242385, SV-242389, SV-242390, SV-242398,
  # SV-242399, SV-242400, SV-242402, SV-242403, SV-242405, SV-242408,
  # SV-242409, SV-242418, SV-242419, SV-242421, SV-242422, SV-242423,
  # SV-242426, SV-242427, SV-242428, SV-242429, SV-242430, SV-242431,
  # SV-242432, SV-242433, SV-242436, SV-242438, SV-242444, SV-242461,
  # SV-242462, SV-242463, SV-242464, SV-242465, SV-245542, SV-245543,
  # SV-245544, SV-254800, SV-254801, SV-274882
  - name: manifests_path
    description: 'Path to Kubernetes manifest files on the target node'
    type: String
    value: '/etc/kubernetes/manifests'
    required: true

  # SV-242379, SV-242380, SV-242423, SV-242426, SV-242427, SV-242428,
  # SV-242432, SV-242433, SV-242445, SV-242459
  - name: etcd_managed_on_node
    description: 'Whether this control-plane node hosts etcd and is responsible for the etcd manifest and data checks; set to false only when etcd is external to the node'
    type: Boolean
    value: true
    required: true

  # SV-242447, SV-242448
  - name: kube_proxy_expected
    description: 'Whether kube-proxy is expected to run on this node; set to false only when an alternative network proxy implementation makes kube-proxy inapplicable'
    type: Boolean
    value: true
    required: true

  # SV-242445, SV-242459
  - name: etcd_data_dir
    description: 'Path to the local etcd data directory on control-plane nodes that host etcd'
    type: String
    value: '/var/lib/etcd'
    required: true

  # SV-242451, SV-242466, SV-242467
  - name: pki_path
    description: 'Path to Kubernetes PKI files on the target node'
    type: String
    value: '/etc/kubernetes/pki/'
    required: true

  # SV-242454, SV-242455
  - name: kubeadm_conf_path
    description: 'Path to kubeadm conf file on the target node'
    type: String
    value: '/etc/systemd/system/kubelet.service.d/10-kubeadm.conf'
    required: true

  # SV-242396, SV-242443
  - name: kubectl_path
    description: 'Path to kubectl on the target node'
    type: String
    value: '/usr/local/bin/kubectl'
    required: true

  # SV-242396
  - name: kubectl_minversion
    description: 'Minimum version of the kubectl binary on the target node'
    type: String
    value: '1.12.9'
    required: true

  # SV-242446, SV-242460
  - name: kubernetes_conf_files
    description: 'Path to Kubernetes conf files on the target node'
    type: Array
    value:
        - /etc/kubernetes/admin.conf
        - /etc/kubernetes/scheduler.conf
        - /etc/kubernetes/controller-manager.conf
    required: true

  # SV-242407, SV-242408, SV-242447, SV-242449, SV-242452, SV-242455,
  # SV-242456, SV-242459, SV-242460, SV-242466, SV-242467
  - name: kubernetes_file_modes
    description: 'Maximum allowable file modes for Kubernetes artifacts. Defaults enforce the unmodified STIG requirements; overrides represent organizational tailoring.'
    type: Hash
    value:
      manifest_files: '0644'
      kubelet_config_file: '0644'
      kube_proxy_kubeconfig_file: '0644'
      kubelet_client_ca_file: '0644'
      kubelet_kubeconfig_file: '0644'
      kubeadm_conf_file: '0644'
      etcd_data_files: '0644'
      kubernetes_conf_files: '0644'
      pki_certificate_files: '0644'
      pki_private_key_files: '0600'
    required: true

  # SV-242464
  - name: audit_log_retention_days
    description: 'Number of days to retain audit logs locally'
    type: Numeric
    value: 30
    required: true

  # SV-242399, SV-242436, SV-254801
  - name: kubernetes_minor_version
    description: 'Kubernetes minor version used to evaluate version-specific controls'
    type: Numeric
    required: true

  # SV-245541
  - name: streaming_connection_idle_timeout_seconds
    description: 'Minimum kubelet streaming connection idle timeout in seconds'
    type: Numeric
    value: 300
    required: true

  # SV-242443
  - name: kubectl_kubeconfig_path
    description: 'Kubeconfig on the target control-plane node used to compare kubectl and API-server versions; assess every API-server endpoint in an HA cluster'
    type: String
    value: '/etc/kubernetes/admin.conf'
    required: true
